; platformio.ini
; Базовые настройки для всех плат
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = pov_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs 
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; Стек задачи хоста NimBLE. По умолчанию 4096, а у нас в ней исполняется
    ; разбор команд: sendRsp() держит буфер ответа на 520 байт прямо на стеке,
    ; поверх обхода каталога LittleFS в buildFileList() и структур телеметрии.
    ; Переполнение стека задачи хоста выглядит как случайная перезагрузка на
    ; ровном месте — искать такое дороже, чем отдать два лишних килобайта.
    -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144

    ; Уровень 1 = только ошибки. По умолчанию nimconfig.h ставит 5 (ничего), и
    ; каждый NIMBLE_LOGE внутри библиотеки превращался в пустое место. Именно
    ; поэтому первая же попытка заливки на живом железе не оставила ни одной
    ; зацепки: отказы «update params», «set data length» и «truncating to N
    ; bytes» существовали, но их некуда было напечатать.
    -D CONFIG_BT_NIMBLE_LOG_LEVEL=1

    ; Колесо — только периферийное устройство: оно объявляет сервис и ждёт
    ; телефон, само ничего не сканирует и ни к чему не подключается. Роли
    ; центрального и наблюдателя тянут за собой код, который никогда не
    ; исполнится, а флеша при 76 % занятости жалко.
    ; Именно *_DISABLED: nimconfig.h включает роль через #ifndef этого имени,
    ; так что «=0» её не выключало, а определяло — то есть делало ровно
    ; противоположное задуманному.
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

monitor_speed = 115200

; V5: акселерометр ICM45605, датчик света BH1750 и шина I2C с платы убраны.
; FastLED не нужен — вывод в SK9822 идёт напрямую через ESP-IDF spi_master + DMA.
; Wi-Fi и веб-интерфейс удалены целиком (AsyncTCP, ESPAsyncWebServer, ElegantOTA,
; ArduinoJson ушли вместе с ними): прошивка похудела на ~470 кБ, и разделы под
; неё ужаты до 1 МБ в пользу библиотеки анимаций (см. pov_16MB.csv).
lib_deps =
    Time
    ; BLE — единственный транспорт. Версия зажата на 1.4.x намеренно:
    ; в 2.x сменились сигнатуры колбэков (onWrite получил NimBLEConnInfo&,
    ; onConnect/onDisconnect потеряли ble_gap_conn_desc*), и povble.cpp написан
    ; под 1.4.x. Обновление до 2.x — это переписывание всех колбэков, а не смена
    ; цифры. NimBLE, а не Bluedroid: тот же профиль стоит втрое меньше флеша и
    ; ~40 кБ ОЗУ, а его у нас впритык из-за кадровых буферов.
    h2zero/NimBLE-Arduino @ ~1.4.3

; --------------------------------------------------------
; ПРОШИВКА
; По USB-кабелю — единственное окружение. По воздуху колесо прошивается из
; приложения по BLE (OP_OTA_*); окружения espota для PlatformIO ушли вместе с
; Wi-Fi.
; --------------------------------------------------------
[env:cable]
upload_protocol = esptool
